<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Devolvam o Palmeiras</title>
  <style>
    :root {
      --verde: #006437;
      --verde-escuro: #004d2a;
      --verde-claro: #1a8a55;
      --branco: #ffffff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(160deg, var(--verde-escuro) 0%, var(--verde) 60%, var(--verde-claro) 100%);
      color: var(--branco);
      font-family: "Segoe UI", Arial, Helvetica, sans-serif;
      text-align: center;
      padding: 24px;
    }
    header h1 {
      font-size: clamp(1.8rem, 5vw, 3.2rem);
      text-transform: uppercase;
      letter-spacing: 3px;
      margin-bottom: 12px;
    }
    header p {
      font-size: clamp(1rem, 2.5vw, 1.4rem);
      max-width: 720px;
      margin: 0 auto 40px;
      line-height: 1.5;
      opacity: 0.95;
    }
    header p strong { color: var(--branco); border-bottom: 2px solid var(--branco); }
    .contador {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 16px;
      margin-bottom: 40px;
    }
    .bloco {
      background: var(--branco);
      color: var(--verde);
      border-radius: 14px;
      min-width: 120px;
      padding: 22px 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    }
    .bloco .num {
      font-size: clamp(2.4rem, 7vw, 4.2rem);
      font-weight: 800;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .bloco .rot {
      margin-top: 8px;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 600;
    }
    .data {
      font-size: 1.1rem;
      background: rgba(255,255,255,0.15);
      border: 2px solid var(--branco);
      border-radius: 999px;
      padding: 10px 24px;
      display: inline-block;
    }
    footer {
      margin-top: 48px;
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .fim {
      font-size: clamp(1.6rem, 5vw, 3rem);
      font-weight: 800;
      margin-bottom: 40px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Devolvam o Palmeiras</h1>
    <p>
      Tempo restante para a <strong>Vascaína</strong>, o <strong>Diretor Comédia</strong>
      e a <strong>Farsa Portuguesa</strong> devolverem o Palmeiras para a sua torcida.
    </p>
  </header>

  <main>
    <div class="contador" id="contador">
      <div class="bloco"><div class="num" id="dias">--</div><div class="rot">Dias</div></div>
      <div class="bloco"><div class="num" id="horas">--</div><div class="rot">Horas</div></div>
      <div class="bloco"><div class="num" id="minutos">--</div><div class="rot">Minutos</div></div>
      <div class="bloco"><div class="num" id="segundos">--</div><div class="rot">Segundos</div></div>
    </div>
    <div class="fim" id="fim" hidden>O Palmeiras é da torcida de novo! 🐷</div>
    <div class="data">31 de dezembro de 2027</div>
  </main>

  <footer>Avanti Palestra 💚</footer>

  <script>
    const alvo = new Date(2027, 11, 31, 23, 59, 59); // 31/12/2027 23:59:59 (horário local)
    const el = {
      dias: document.getElementById('dias'),
      horas: document.getElementById('horas'),
      minutos: document.getElementById('minutos'),
      segundos: document.getElementById('segundos'),
      contador: document.getElementById('contador'),
      fim: document.getElementById('fim'),
    };
    const pad = n => String(n).padStart(2, '0');

    function atualizar() {
      const diff = alvo - new Date();
      if (diff <= 0) {
        el.contador.hidden = true;
        el.fim.hidden = false;
        clearInterval(timer);
        return;
      }
      const s = Math.floor(diff / 1000);
      el.dias.textContent = Math.floor(s / 86400);
      el.horas.textContent = pad(Math.floor((s % 86400) / 3600));
      el.minutos.textContent = pad(Math.floor((s % 3600) / 60));
      el.segundos.textContent = pad(s % 60);
    }

    atualizar();
    const timer = setInterval(atualizar, 1000);
  </script>
</body>
</html>
